<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominio e imagen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="envoltorio">

  <div class="contenedor">

    <p class="enunciado">¿Cuál es el dominio y cuál la imagen de esta función?</p>

    <!-- Aquí el script dibuja el diagrama sagital -->
    <div id="diagrama"></div>

    <div class="controles">
      <label for="dominio">Dominio (separado por comas):</label>
      <input type="text" id="dominio" autocomplete="off" placeholder="ej: 1, 3, 5">

      <label for="imagen">Imagen (separada por comas):</label>
      <input type="text" id="imagen" autocomplete="off" placeholder="ej: a, c">

      <div class="botones">
        <button type="button" id="btn-verificar">Verificar</button>
        <button type="button" id="btn-nueva">Nueva función</button>
      </div>
    </div>

    <p class="respuesta" id="respuesta"></p>
  </div>

  </div>
<script src="script.js"></script>

<script>
/* Ajusta la escala del contenido al alto de la ventana del iframe */
(function () {
  const envoltorio = document.getElementById("envoltorio");

  function ajustar() {
    const altoReal = envoltorio.offsetHeight;
    if (!altoReal) return;
    const factor = Math.min(1, (window.innerHeight - 4) / altoReal);
    envoltorio.style.transform = "scale(" + factor + ")";
  }

  window.addEventListener("resize", ajustar);
  if (window.ResizeObserver) new ResizeObserver(ajustar).observe(envoltorio);
  ajustar();
})();
</script>

</body>
</html>
